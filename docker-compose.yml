services:
  ace-rfid-writer:
    build: .
    ports:
      - "3000:3000"
    environment:
      # URL of your Spoolman instance, e.g. http://spoolman:7912 — leave empty to disable the integration
      - SPOOLMAN_URL=
    # USB access for ACR122U
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    restart: unless-stopped
